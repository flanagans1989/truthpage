{# One header for every public page. `width` lets a narrower page keep its
   own measure without a second copy of the markup. #}
<header class="border-b border-slate-200 bg-white">
    <div class="{{ width | default('max-w-5xl') }} mx-auto px-6 py-4 flex items-center justify-between gap-4">
        <a href="{{ u('/') }}" class="text-blue-600 font-bold text-xl">TrustPages</a>
        <nav class="flex items-center gap-5 text-sm">
            <a href="{{ u('/vendors') }}" class="hidden sm:inline text-slate-600 hover:text-slate-900">{{ t('nav.directory') }}</a>
            <a href="{{ u('/compare') }}" class="hidden sm:inline text-slate-600 hover:text-slate-900">{{ t('nav.compare') }}</a>
            <a href="{{ u('/pricing') }}" class="text-slate-600 hover:text-slate-900">{{ t('nav.pricing') }}</a>
            {% include "_lang_switcher.html" %}
            <a href="/auth/login" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg">{{ t('nav.signin') }}</a>
        </nav>
    </div>
</header>
