<div id="objection-window-setting" class="flex items-center justify-between gap-4 mt-4 pt-4 border-t border-slate-100">
    <div>
        <p class="text-sm font-medium text-slate-900">Objection window</p>
        <p class="text-xs text-slate-500 mt-0.5">
            How many days your own DPA gives customers to object to a sub-processor change,
            starting from the moment a notice is sent.
        </p>
    </div>
    <form hx-post="/dashboard/settings/objection-window"
          hx-target="#objection-window-setting"
          hx-swap="outerHTML"
          class="flex items-center gap-2 shrink-0">
        <input type="number" name="objection_window_days" min="1" max="365"
               value="{{ tenant.objection_window_days }}"
               class="w-16 text-sm px-2 py-1.5 rounded-lg border border-slate-300 text-right">
        <span class="text-xs text-slate-500">days</span>
        <button type="submit"
                class="text-xs font-medium px-3 py-1.5 rounded-lg border border-slate-300 text-slate-700 hover:border-slate-400 transition">
            Save
        </button>
    </form>
</div>
